# Extends the base compose file with an nginx reverse proxy.
# Usage: docker compose -f docker-compose.yml -f infra/nginx/docker-compose.nginx.yml up -d

services:
  nginx:
    build:
      context: ./infra/nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "${NGINX_PORT:-80}:80"