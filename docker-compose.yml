name: callcenter-crm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-callcenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callcenter}
      POSTGRES_DB: ${POSTGRES_DB:-callcenter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callcenter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-callcenter}:${POSTGRES_PASSWORD:-callcenter}@db:5432/${POSTGRES_DB:-callcenter}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-14d}
      JWT_ISSUER: ${JWT_ISSUER:-callcenter-crm}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-EXOTEL}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      TATA_API_URL: ${TATA_API_URL:-https://api-smartflo.tatateleservices.com}
      TATA_TOKEN: ${TATA_TOKEN:-}
      TATA_EMAIL: ${TATA_EMAIL:-}
      TATA_PASSWORD: ${TATA_PASSWORD:-}
      TATA_AGENT_NUMBER: ${TATA_AGENT_NUMBER:-}
      TATA_CALLER_ID: ${TATA_CALLER_ID:-}
      EXOTEL_ACCOUNT_SID: ${EXOTEL_ACCOUNT_SID:-}
      EXOTEL_API_KEY: ${EXOTEL_API_KEY:-}
      EXOTEL_API_TOKEN: ${EXOTEL_API_TOKEN:-}
      EXOTEL_SUBDOMAIN: ${EXOTEL_SUBDOMAIN:-api.exotel.com}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      KNOWLARITY_ACCOUNT_ID: ${KNOWLARITY_ACCOUNT_ID:-}
      KNOWLARITY_API_KEY: ${KNOWLARITY_API_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/src/main.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3001}:3001"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
      PORT: 3001
      HOSTNAME: 0.0.0.0

volumes:
  pgdata:
  redisdata: